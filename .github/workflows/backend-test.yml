name: Backend tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitastay_new_back
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nivas_hostel_test
          MYSQL_USER: nivas_user
          MYSQL_PASSWORD: nivas_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: nivas_user
      DB_PASSWORD: nivas_pass
      DB_NAME_TEST: nivas_hostel_test
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vitastay_new_back/package-lock.json
      - run: npm ci
      - run: npm test
